name: Build desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  build-windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run make:win
      - run: npm run smoke:packaged
        env:
          SPACECRAFT_SMOKE_OUTPUT: ${{ runner.temp }}/spacecraft-packaged-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spacecraft-windows-startup-check
          path: |
            ${{ runner.temp }}/spacecraft-packaged-smoke/*.png
            ${{ runner.temp }}/spacecraft-packaged-smoke/*.json
      - run: node scripts/stage-release.mjs windows x64
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: release/windows-x64/**

  build-macos-arm64:
    needs: verify
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run make:mac:arm64
      - run: npm run smoke:packaged -- "out/SPACECRAFT 星航双子-darwin-arm64/SPACECRAFT 星航双子.app/Contents/Resources/app.asar"
        env:
          SPACECRAFT_SMOKE_OUTPUT: ${{ runner.temp }}/spacecraft-packaged-smoke
      - run: node scripts/stage-release.mjs macOS arm64
      - uses: actions/upload-artifact@v4
        with:
          name: release-macOS-arm64
          path: release/macOS-arm64/**

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Publish stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="docs/RELEASE-${VERSION}.md"
          test -f "$NOTES"
          RELEASE_STATE="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ "$RELEASE_STATE" = "false" ]; then
            echo "Release ${GITHUB_REF_NAME} is already public."
            exit 0
          fi
          if [ "$RELEASE_STATE" = "true" ]; then
            gh release edit "$GITHUB_REF_NAME" --title "SPACECRAFT ${VERSION}" --notes-file "$NOTES" --draft
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "SPACECRAFT ${VERSION}" --notes-file "$NOTES" --draft
          fi
          for ASSET in release/*; do
            UPLOADED=false
            for ATTEMPT in 1 2 3 4; do
              if gh release upload "$GITHUB_REF_NAME" "$ASSET" --clobber; then
                UPLOADED=true
                break
              fi
              if [ "$ATTEMPT" -lt 4 ]; then
                sleep "$((ATTEMPT * 15))"
              fi
            done
            if [ "$UPLOADED" != "true" ]; then
              echo "Failed to upload ${ASSET} after four attempts."
              exit 1
            fi
          done
          gh release edit "$GITHUB_REF_NAME" --draft=false
