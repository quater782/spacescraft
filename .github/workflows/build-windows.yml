name: Build desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  build-windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run make:win
      - run: npm run smoke:packaged
        env:
          SPACECRAFT_SMOKE_OUTPUT: ${{ runner.temp }}/spacecraft-packaged-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spacecraft-windows-startup-check
          path: |
            ${{ runner.temp }}/spacecraft-packaged-smoke/*.png
            ${{ runner.temp }}/spacecraft-packaged-smoke/*.json
      - run: node scripts/stage-release.mjs windows x64
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: release/windows-x64/**

  build-macos-arm64:
    needs: verify
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run make:mac:arm64
      - run: npm run smoke:packaged -- "out/SPACECRAFT 星航双子-darwin-arm64/SPACECRAFT 星航双子.app/Contents/Resources/app.asar"
        env:
          SPACECRAFT_SMOKE_OUTPUT: ${{ runner.temp }}/spacecraft-packaged-smoke
      - run: node scripts/stage-release.mjs macOS arm64
      - uses: actions/upload-artifact@v4
        with:
          name: release-macOS-arm64
          path: release/macOS-arm64/**

  build-macos-x64:
    needs: verify
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run make:mac:x64
      - run: npm run smoke:packaged -- "out/SPACECRAFT 星航双子-darwin-x64/SPACECRAFT 星航双子.app/Contents/Resources/app.asar"
        env:
          SPACECRAFT_SMOKE_OUTPUT: ${{ runner.temp }}/spacecraft-packaged-smoke
      - run: node scripts/stage-release.mjs macOS x64
      - uses: actions/upload-artifact@v4
        with:
          name: release-macOS-x64
          path: release/macOS-x64/**

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos-arm64, build-macos-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Publish stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="docs/RELEASE-${VERSION}.md"
          test -f "$NOTES"
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "SPACECRAFT ${VERSION}" --notes-file "$NOTES"
